# Conda environment for the notebooks (conda-forge). All notebooks were run with R 4.5.3 (ggplot2 4.0.4,
# patchwork 1.3.2) and Python 3.11 (pandas 2.2.3, numpy 1.26.4).
#   micromamba create -p ./env -f environment.yml
#   ./env/bin/Rscript -e 'install.packages("errors", repos = "https://cloud.r-project.org")'   # not on conda-forge
#   ./env/bin/pip install fuzzysearch                                                           # not on conda-forge
name: perpetual-exponential-growth
channels:
  - conda-forge
dependencies:
  - python=3.11
  - jupyterlab
  - nbclient
  - numpy=1.26
  - pandas=2.2
  - scipy
  - matplotlib
  - seaborn
  - tqdm
  - filterpy
  - iso8601
  - biopython
  - python-levenshtein
  - beautifulsoup4
  - r-base=4.5
  - r-irkernel
  - r-ggplot2>=4.0
  - r-patchwork
  - r-tidyverse
  - r-ggbeeswarm
  - r-vroom
  - r-lubridate
  - r-scales
  - r-hdinterval
  - r-wesanderson
  - r-ggplotify
  - r-magick
  - r-ggtext
  - r-ggh4x
  - r-ggrepel
  - r-colorspace
  - r-broom
  - r-moments
  - r-slider
  - r-reticulate
  - r-rjson
